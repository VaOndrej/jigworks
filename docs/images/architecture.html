<main>
<header>
  <h1>Jigworks architecture</h1>
  <p>A versioned workflow (the jig) is published once in the hub and runs the same way on every engineer's machine. Solid lines are built in the prototype; dashed lines are designed but not built.</p>
</header>

  <figcaption>The hub never runs workflow code and never sees CLI credentials. A run is pinned to a release digest, so everyone runs the same graph, prompts, models and skills. The runner sends events to the hub over the API, and the hub turns them into the audit trail and the per-release analytics.</figcaption>

  <figcaption>Orange marks the LangGraph interrupts where the engineer decides. Triage sends a small change straight to planning and a larger one through rounds of design questions first. Every agent is a separate session with its own context and tools: the test writer never sees the code, and the implementer cannot edit the tests or the invariants. The gate is plain code, not a model. Fixing never loops silently: when it stops making progress, the run waits for a person.</figcaption>
