[project]
name = "btc-paper-trader"
version = "0.1.0"
description = "Local BTC/USD paper-trading exchange with an internal order book, bots and a house market maker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=12",
  "aiosqlite>=0.20",
]

[project.scripts]
btc-paper-trader = "btc_paper_trader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_paper_trader"]
