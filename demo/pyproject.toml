[project]
name = "btc-paper-trader-workspace"
version = "0.0.0"
description = "uv workspace root for the demo projects (separate from the jigworks root)."
requires-python = ">=3.12,<3.13"
dependencies = ["btc-paper-trader"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["btc-paper-trader"]

[tool.uv.sources]
btc-paper-trader = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "pytest-asyncio>=0.24",
  "playwright>=1.45",
]
