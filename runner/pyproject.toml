[project]
name = "jigworks-runner"
version = "0.0.0"
description = "Local Jigworks runner and CLI agent adapters."
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.8",
    "jigworks-contracts",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jigworks_runner"]

[tool.uv.sources]
jigworks-contracts = { workspace = true }
