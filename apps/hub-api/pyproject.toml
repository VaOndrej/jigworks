[project]
name = "jigworks-hub-api"
version = "0.0.0"
description = "Jigworks Hub API (FastAPI) served as a Vercel Service."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub_api"]
