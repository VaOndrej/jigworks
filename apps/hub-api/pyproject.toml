[project]
name = "jigworks-hub-api"
version = "0.0.0"
description = "Jigworks Hub API (FastAPI) served as a Vercel Service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jigworks-contracts",
    "psycopg[binary]>=3.2",
    "vercel-blob>=0.6.1",
    "vercel-headers>=0.8.0",
    "vercel-sandbox>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub_api"]

[tool.uv.sources]
jigworks-contracts = { workspace = true }
