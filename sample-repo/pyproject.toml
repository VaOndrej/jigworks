[project]
name = "jigworks-sample-repo"
version = "0.0.0"
description = "Synthetic order-handling service with invariants (filled in by T03)."
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample_repo"]
